<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Struck gold foil gradient (warm 18k gold) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E7C4"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#A87B16"/>
      <stop offset="100%" stop-color="#E2BE71"/>
    </linearGradient>

    <!-- Deep obsidian / midnight bank ink -->
    <linearGradient id="sealBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121726"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>

    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Seal Foundation Tile -->
  <rect width="64" height="64" rx="14" fill="url(#sealBg)"/>

  <!-- Outer Struck Foil Rim -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

