# ==============================================================================
# Google Cloud Build Pipeline for Cymbal Premier Wealth Studio
# Triggers on commits to 'main' branch and deploys to Cloud Run in asia-south1
# ==============================================================================
steps:
  # 1. Build unified multi-stage container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-container'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gemini-bfsi-wealth-studio:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gemini-bfsi-wealth-studio:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gemini-bfsi-wealth-studio:$COMMIT_SHA'

  # 3. Deploy container image to Cloud Run in asia-south1 (Mumbai)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'gemini-bfsi-wealth-studio'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gemini-bfsi-wealth-studio:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=asia-south1,BRAIN_LOCATION=global,BRAIN_MODEL=gemini-3.5-flash-lite,IMAGE_LOCATION=global,IMAGE_MODEL=gemini-3-pro-image,VTO_MODEL=gemini-3.1-flash-image,AVATAR_TRANSPORT=${_AVATAR_TRANSPORT},LIVE_PROJECT=${_LIVE_PROJECT},LIVE_LOCATION=${_LIVE_LOCATION},LIVE_MODEL=${_LIVE_MODEL},AVATAR_NAME=${_AVATAR_NAME},AVATAR_VOICE=${_AVATAR_VOICE},FALLBACK_TTS_VOICE=en-IN-Journey-F'

substitutions:
  _AVATAR_TRANSPORT: 'live'
  _LIVE_PROJECT: '$PROJECT_ID'
  _LIVE_LOCATION: 'us-central1'
  _LIVE_MODEL: 'gemini-3.1-flash-live-preview-04-2026'
  _AVATAR_NAME: 'Kira'
  _AVATAR_VOICE: 'Aoede'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gemini-bfsi-wealth-studio:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gemini-bfsi-wealth-studio:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
